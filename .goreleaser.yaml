# Builds release binaries for every platform on a v* tag (see
# .github/workflows/release.yaml). Docker images are built separately from the
# Dockerfile, so they also bundle flux-schema. Homebrew: not yet.
version: 2

project_name: gitops-preflight

builds:
  - main: ./cmd/gitops-preflight
    binary: gitops-preflight
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/shimagrawal/gitops-preflight/internal/cli.Version={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]
