# Builds release binaries for every platform on a v* tag (see
# .github/workflows/release.yaml). Docker images are built separately from the
# Dockerfile, so they also bundle flux-schema.
version: 2

project_name: gitops-preflight

builds:
  - main: ./cmd/gitops-preflight
    binary: gitops-preflight
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/shimagrawal/gitops-preflight/internal/cli.Version={{ .Tag }}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]

checksum:
  name_template: checksums.txt

changelog:
  use: github
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^ci:"]

# Homebrew: needs a shimagrawal/homebrew-tap repository and a HOMEBREW_TAP_TOKEN
# secret (a token that can push to it). Remove this block to release without it.
brews:
  - name: gitops-preflight
    repository:
      owner: shimagrawal
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: https://github.com/shimagrawal/gitops-preflight
    description: Validate Kargo, Argo CD and Kubernetes manifests against pinned schemas
    license: Apache-2.0
    dependencies:
      - name: flux-schema
        type: optional
    caveats: |
      gitops-preflight needs flux-schema: https://github.com/fluxcd/flux-schema/releases
    test: |
      system "#{bin}/gitops-preflight", "--version"
